# ViT-Small/16 scratch baseline — STL-10
# Run for each label_fraction × seed combination.
# Output: results/runs/baseline/<label_fraction>/<seed>/

variant:          "ViT-Small/16"    # ~22M params; appropriate for 5K labeled images
label_fraction:   0.01              # change to 0.05 | 0.10 | 1.0 per run
seed:             0                 # change to 1 | 2 per run
epochs:           250
batch_size:       64                # silently capped at len(train_set) for small fracs
base_lr:          0.0001
weight_decay:     0.1
dropout:          0.1
warmup_fraction:  0.1               # first 10% of total steps = linear warmup
smoothing_window: 10                # reported_acc = mean(test_acc[-10:])