# MAE + Diffusion duo fusion — STL-10

encoders:
  - name: "mae"
    ckpt: "results/checkpoints/mae_encoder.pt"
    variant: "ViT-Small/16"
  - name: "diffusion"
    ckpt: null
    diffusion_model: "google/ddpm-cifar10-32"
    timestep: 250
    hook_layer: "mid_block"

fusion_mode:      "concat_proj"
fused_dim:        256

label_fraction:   0.01 # change to 0.05 | 0.10 | 1.0 per run
seed:             0 # change to 1 | 2 per run
epochs:           30
batch_size:       64
base_lr:          0.001
weight_decay:     0.0
smoothing_window: 10
