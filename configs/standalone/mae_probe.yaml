# MAE linear probe — STL-10
# Encoder: frozen MAE ViT-Small/16 pretrained on 100K unlabeled STL-10 images.
# Only the linear head trains.

encoder:          "mae"
encoder_ckpt:     "results/checkpoints/mae_encoder.pt"
variant:          "ViT-Small/16"
label_fraction:   0.01             # change to 0.05 | 0.10 | 1.0 per run
seed:             0                # change to 1 | 2 per run
epochs:           30
batch_size:       64
base_lr:          0.001            # higher LR is fine — only the small head trains
weight_decay:     0.0
smoothing_window: 10
