# DINO linear probe — STL-10
# Encoder: frozen DINO ViT-Small/16 (student) pretrained on 100K unlabeled STL-10 images.
# Only the linear head trains.

encoder:          "dino"
encoder_ckpt:     "results/checkpoints/dino_encoder.pt"
variant:          "ViT-Small/16"
label_fraction:   0.01             # change to 0.05 | 0.10 | 1.0 per run
seed:             0                # change to 1 | 2 per run
epochs:           30
batch_size:       64
base_lr:          0.001
weight_decay:     0.0
smoothing_window: 10
