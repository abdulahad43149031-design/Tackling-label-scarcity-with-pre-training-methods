base_lr: 0.001
batch_size: 64
encoders:
- ckpt: results/checkpoints/dino_encoder.pt
  name: dino
  variant: ViT-Small/16
- ckpt: null
  diffusion_model: google/ddpm-cifar10-32
  hook_layer: mid_block
  name: diffusion
  timestep: 250
epochs: 30
fused_dim: 256
fusion_mode: concat_proj
label_fraction: 0.01
seed: 0
smoothing_window: 10
weight_decay: 0.0
